[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lift-elsso-ragret_jd333"
version = "0.1.0"
description = "通过字符级与结构级特征识别RAG 检索工程师·梯度累积与有效批量的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lift-elsso" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lift-elsso.github.io"
Repository = "https://github.com/lift-elsso/ragret_jd333"
Issues = "https://github.com/lift-elsso/ragret_jd333/issues"

[project.scripts]
ragret_jd333 = "ragret_jd333:main"

[tool.setuptools]
py-modules = ["ragret_jd333"]
